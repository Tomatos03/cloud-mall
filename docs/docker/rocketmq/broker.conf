# Broker Configuration for online-mall project

# Broker Name
brokerName=broker-a

# Broker ID: 0 represents Master, >0 represents Slave
brokerId=0

# NameServer Address
namesrvAddr=rocketmq-namesrv:9876

# Data directory path
storePathRootDir=/home/rocketmq/store/broker-a

# Commit Log storage path
storePathCommitLog=/home/rocketmq/store/broker-a/commitlog

# Consume Queue storage path
storePathConsumeQueue=/home/rocketmq/store/broker-a/consumequeue

# Index storage path
storePathIndex=/home/rocketmq/store/broker-a/index

# Checkpoint file storage path
storePathCheckpoint=/home/rocketmq/store/broker-a/checkpoint

# RocketMQ abort file storage path
abortFile=/home/rocketmq/store/broker-a/abort

# Message store class
messageStorePluginClass=org.apache.rocketmq.store.DefaultMessageStore

# delete file at the first time of startup
deleteWhen=04

# Storage class type
storePathExt=/home/rocketmq/store/broker-a/ext

# File reserved time, in hours
fileReservedTime=48

# Enable pool of FileChannel
pooledByteBufAllocatorEnable=true

# The maximum value of brokerPermission
brokerPermission=30

# Listening port
listenPort=10911

# Server worker threads
serverWorkerThreads=8

# Server selector threads
serverSelectorThreads=3

# Server socket send buffer size
serverSocketSendBufSize=65536

# Server socket receive buffer size
serverSocketRcvBufSize=65536

# Server channel max idle time in seconds
serverChannelMaxIdleTimeSeconds=120

# Broker IP
# brokerIP1=192.168.1.1

# Broker IP for internal communication
# brokerIP2=192.168.1.2

# Enable broker fast failure
enablePropertyFilter=true