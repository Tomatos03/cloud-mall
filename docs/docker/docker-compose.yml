volumes:
  mysql_data:
  redis_data:
  es_data:
  rocketmq_namesrv_data:
  rocketmq_broker_data:
  rocketmq_broker_store:
  minio_data:

networks:
  online-mall-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: online-mall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - online-mall-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:6.2
    container_name: online-mall-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - online-mall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        ELASTICSEARCH_VERSION: 8.18.8
    image: online-mall-elasticsearch:8.18.8
    container_name: online-mall-elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - xpack.security.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    networks:
      - online-mall-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      timeout: 20s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: online-mall-rocketmq-namesrv
    user: root
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT}:9876"
    volumes:
      - rocketmq_namesrv_data:/home/rocketmq/logs
    networks:
      - online-mall-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876'"]
      timeout: 20s
      retries: 10

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: online-mall-rocketmq-broker
    user: root
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /etc/rocketmq/broker.conf
    ports:
      - "${ROCKETMQ_BROKER_PORT}:10911"
    volumes:
      - rocketmq_broker_data:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/etc/rocketmq/broker.conf
    networks:
      - online-mall-network
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10911'"]
      timeout: 20s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-12-23T07-19-11Z
    container_name: online-mall-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - online-mall-network
